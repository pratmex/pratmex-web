<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Room</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Live Background Layer (Shared by Onboarding & Study Room) -->
    <div id="scene-container">
        <!-- Female Study Room -->
        <img id="female-scene" class="scene-layer" referrerpolicy="no-referrer" alt="Anime Female Study Room" src="https://i.redd.it/crwnrm9q6jl51.jpg">

        <!-- Male Study Room (Local PNG) -->
        <img id="male-scene" class="scene-layer active-scene" alt="Anime Male Study Room" src="1354758.png">

        <!-- Visual Rain Canvas Overlay -->
        <canvas id="rain-canvas"></canvas>
    </div>

    <!-- Onboarding Overlay -->
    <div id="onboarding-screen" class="active">
        <div class="onboarding-content glass-panel-heavy">
            <h1>Welcome to your space.</h1>
            <p>Let's set up your desk.</p>
            
            <div class="input-group">
                <input type="text" id="user-name" placeholder="What is your name?" autocomplete="off" required>
            </div>
            
            <div class="gender-selection">
                <label>
                    <input type="radio" name="gender" value="male" checked>
                    <span class="radio-btn">Male</span>
                </label>
                <label>
                    <input type="radio" name="gender" value="female">
                    <span class="radio-btn">Female</span>
                </label>
            </div>

            <button id="start-btn" class="primary-btn">Enter Room</button>
        </div>
    </div>

    <!-- The Study Room UI -->
    <div id="study-room" class="hidden">
        <div class="ui-layer">
            
            <!-- Neon Nameplate -->
            <div class="nameplate">
                <span id="display-name">Guest</span>'s Desk
            </div>

            <!-- Floating Tools (Fullscreen, Zen Mode, Profile Settings) -->
            <div class="floating-tools">
                <button id="fullscreen-btn" class="glass-btn" title="Toggle Fullscreen (Esc to exit)">⛶</button>
                <button id="zen-btn" class="glass-btn" title="Toggle Zen Mode">🧘</button>
                <button id="profile-btn" class="glass-btn" title="Change Name or Room">⚙️</button>
            </div>

            <!-- Time Engine & Tasks Widget -->
            <div class="widget clock-widget glass-panel">
                <div class="tabs">
                    <button class="tab-btn active" data-target="local-time">Clock</button>
                    <button class="tab-btn" data-target="pomodoro">Pomodoro</button>
                    <button class="tab-btn" data-target="stopwatch">Stopwatch</button>
                    <button class="tab-btn" data-target="tasks">Tasks</button>
                </div>
                
                <!-- Tab 1: Local Clock -->
                <div id="local-time" class="tab-content active-tab">
                    <h2 id="current-time">00:00</h2>
                    <p id="current-date">Loading...</p>
                </div>

                <!-- Tab 2: Pomodoro / Custom Timer -->
                <div id="pomodoro" class="tab-content">
                    <div id="pomo-mode-badge" class="mode-badge focus-badge">FOCUS SESSION</div>
                    <h2 id="pomodoro-display">25:00</h2>
                    <div class="controls">
                        <button id="pomo-start">Start</button>
                        <button id="pomo-pause">Pause</button>
                        <button id="pomo-reset">Reset</button>
                    </div>
                    <div class="pomo-settings">
                        <button class="pomo-preset active-preset" data-focus="25" data-break="5">25 / 5</button>
                        <button class="pomo-preset" data-focus="50" data-break="10">50 / 10</button>
                        <button id="pomo-switch-mode" title="Switch Focus / Break">⇄ Mode</button>
                    </div>
                    <div class="custom-time">
                        <input type="number" id="custom-focus-input" placeholder="Focus" min="1" max="180" title="Focus minutes">
                        <input type="number" id="custom-break-input" placeholder="Break" min="1" max="60" title="Break minutes">
                        <button id="set-custom-time">Set</button>
                    </div>
                </div>

                <!-- Tab 3: Stopwatch -->
                <div id="stopwatch" class="tab-content">
                    <h2 id="stopwatch-display">00:00:00</h2>
                    <div class="controls">
                        <button id="sw-start">Start</button>
                        <button id="sw-pause">Pause</button>
                        <button id="sw-reset">Reset</button>
                    </div>
                </div>

                <!-- Tab 4: Tasks -->
                <div id="tasks" class="tab-content">
                    <div class="task-input-row">
                        <input type="text" id="new-task-input" placeholder="Add a study task..." autocomplete="off">
                        <button id="add-task-btn">Add</button>
                    </div>
                    <ul id="task-list"></ul>
                </div>
            </div>

            <!-- Music & Procedural Audio Widget -->
            <div class="widget music-widget glass-panel">
                <div class="track-info">
                    <h3 id="track-name">Midnight Study</h3>
                    <p id="track-artist">Lofi Vibes</p>
                </div>
                <div class="controls">
                    <button id="prev-track" title="Previous Track">⏮</button>
                    <button id="play-pause" title="Play / Pause">▶</button>
                    <button id="next-track" title="Next Track">⏭</button>
                </div>
                <div class="volume-control">
                    <button id="mute-btn" class="icon-btn" title="Mute / Unmute">🔊</button>
                    <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.45">
                </div>
                
                <!-- Procedural Ambient Rain Engine -->
                <div class="ambient-controls">
                    <button id="rain-toggle" class="ambient-btn">🌧️ Rain: OFF</button>
                    <input type="range" id="rain-volume" min="0" max="1" step="0.05" value="0.35">
                </div>
            </div>

        </div>
    </div>

    <!-- Audio Tag for Track 1 (Verified MP3) -->
    <audio id="bg-music" preload="auto"></audio>

    <script src="app.js"></script>
</body>
</html>
